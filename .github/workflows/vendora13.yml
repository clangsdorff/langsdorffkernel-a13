name: A13 Vendor Build

on:
  workflow_dispatch:

jobs:
  Vendor:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Checkout stock vendors
      uses: actions/checkout@v6
      with:
        ref: a13-vendor-stock
        path: stock
    - name: Install tools
      run: |
        sudo apt-get install -y attr zip unzip autoconf automake libtool pkg-config liblz4-dev uuid-dev zlib1g-dev
        git clone --depth 1 -b v1.9.4 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-src
        (cd /tmp/erofs-src && ./autogen.sh && ./configure --prefix="$HOME/erofs-utils" && make -j$(nproc) && make install)
        echo "$HOME/erofs-utils/bin" >> "$GITHUB_PATH"
    - name: Verify stock vendors
      working-directory: stock
      run: |
        for z in a13_stock_vendor.zip a14_stock_vendor.zip; do cat "$z".[0-9][0-9] > "$z"; done
        unzip -q a14_stock_vendor.zip
        sudo unzip -q a13_stock_vendor.zip -d a13_vendor
        sha256sum -c SHA256SUMS
        md5sum -c MD5SUMS
    - name: Build vendor
      run: |
        NAME=langsdorff@a13-$(git rev-parse --short HEAD)_vendor
        mkdir -p dist
        sudo env PATH="$PATH" bash kernel_build/a13/vendor/mkvendor_a13.sh stock/a13_vendor stock/vendor_a14.img "dist/$NAME.img"
        sudo chown "$(id -u):$(id -g)" "dist/$NAME.img"
        python3 kernel_build/avbtool add_hashtree_footer --image "dist/$NAME.img" --partition_name vendor \
          --hash_algorithm sha256 --algorithm SHA256_RSA4096 \
          --key kernel_build/mkbootimg/gki/testdata/testkey_rsa4096.pem --do_not_generate_fec
        (cd dist && zip -9 -q "$NAME.zip" "$NAME.img" && rm "$NAME.img")
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: A13-Vendor
        path: dist/*_vendor.zip
