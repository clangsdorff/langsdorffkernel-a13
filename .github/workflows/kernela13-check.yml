name: A13 Partial Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'make targets (empty = kernel_build/a13/check_targets)'
        required: false
        default: ''
  push:
    branches:
      - a13-port

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install tools
      run: |
        sudo apt-get install libelf-dev -y
        git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$(readlink -f ..)/clang-r450784d" --depth=1
    - name: Build targets
      env:
        INPUT_TARGETS: ${{ github.event.inputs.targets }}
      run: |
        TARGETS="$INPUT_TARGETS"
        [ -z "$TARGETS" ] && TARGETS="$(grep -v '^#' kernel_build/a13/check_targets | xargs)"
        echo "targets: $TARGETS"
        export PATH="$(readlink -f ..)/clang-r450784d/bin:$PATH"
        export ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- PLATFORM_VERSION=14 TARGET_SOC=s5e3830
        make -j$(nproc) O=out a13noavb_defconfig
        scripts/config --file out/.config -d DEBUG_INFO_BTF
        make -j$(nproc) O=out olddefconfig
        make -j$(nproc) O=out prepare
        make -k -j$(nproc) O=out $TARGETS 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
    - name: Errors
      if: always()
      run: grep -E "error:|Error [0-9]|undefined" build.log || true
