name: A13 Check and Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'make targets (empty = kernel_build/a13/check_targets)'
        required: false
        default: ''
  push:
    branches:
      - a13-port

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: /home/runner/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:clang-r450784d
      CCACHE_MAXSIZE: 3G

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Restore clang
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/clang-r450784d
        key: clang-r450784d
    - name: Install tools
      run: |
        sudo apt-get install libelf-dev ccache -y
        [ -d "$(readlink -f ..)/clang-r450784d/bin" ] || git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$(readlink -f ..)/clang-r450784d" --depth=1
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/ccache
        key: ccache-check-${{ github.sha }}
        restore-keys: ccache-check-
    - name: Build targets
      env:
        INPUT_TARGETS: ${{ github.event.inputs.targets }}
      run: |
        TARGETS="$INPUT_TARGETS"
        [ -z "$TARGETS" ] && TARGETS="$(grep -v '^#' kernel_build/a13/check_targets | xargs)"
        echo "targets: $TARGETS"
        export PATH="$(readlink -f ..)/clang-r450784d/bin:$PATH"
        export ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- PLATFORM_VERSION=14 TARGET_SOC=s5e3830
        make -j$(nproc) O=out CC="ccache clang" a13noavb_defconfig
        scripts/config --file out/.config -d DEBUG_INFO_BTF
        make -j$(nproc) O=out CC="ccache clang" olddefconfig
        make -j$(nproc) O=out CC="ccache clang" prepare
        make -k -j$(nproc) O=out CC="ccache clang" $TARGETS 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
    - name: Errors
      if: always()
      run: grep -E "error:|Error [0-9]|undefined" build.log || true
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ~/ccache
        key: ccache-check-${{ github.sha }}
    - name: Prune old ccache
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: ccache-check-${{ github.sha }}
      run: |
        gh cache list -R "$GITHUB_REPOSITORY" -k "$KEEP" --json key -q '.[].key' | grep -qx "$KEEP" || exit 0
        gh cache list -R "$GITHUB_REPOSITORY" -k ccache-check- -L 100 --json id,key -q ".[] | select(.key != \"$KEEP\") | .id" |
          xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

  build:
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: /home/runner/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:clang-r450784d
      CCACHE_MAXSIZE: 3G

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Restore clang
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/clang-r450784d
        key: clang-r450784d
    - name: Install tools
      run: |
        sudo apt-get install python2 pahole libelf-dev zstd brotli ccache -y
        [ -d "$(readlink -f ..)/clang-r450784d/bin" ] || git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$(readlink -f ..)/clang-r450784d" --depth=1
    - uses: rui314/setup-mold@v1
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/ccache
          ${{ github.workspace }}/out/.thinlto-cache
        key: ccache-build-${{ github.sha }}
        restore-keys: ccache-build-
    - name: Build
      run: |
        ccache -z
        bash kernel_build/builda13.sh "$(pwd)"
    - name: Cache stats
      if: always()
      run: ccache -s
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          ~/ccache
          ${{ github.workspace }}/out/.thinlto-cache
        key: ccache-build-${{ github.sha }}
    - name: Prune old ccache
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: ccache-build-${{ github.sha }}
      run: |
        gh cache list -R "$GITHUB_REPOSITORY" -k "$KEEP" --json key -q '.[].key' | grep -qx "$KEEP" || exit 0
        gh cache list -R "$GITHUB_REPOSITORY" -k ccache-build- -L 100 --json id,key -q ".[] | select(.key != \"$KEEP\") | .id" |
          xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: A13-Kernel
        path: kernel_build/langsdorff@a13*

  vendor:
    needs: build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Checkout stock vendors
      uses: actions/checkout@v6
      with:
        ref: a13-vendor-stock
        path: stock
    - name: Download kernel
      uses: actions/download-artifact@v8
      with:
        name: A13-Kernel
        path: kernel
    - name: Restore erofs-utils
      id: erofs
      uses: actions/cache@v4
      with:
        path: ~/erofs-utils
        key: erofs-utils-v1.9.4-ubuntu-24.04
    - name: Install tools
      run: |
        sudo apt-get install -y attr zip unzip
        if [ ! -x ~/erofs-utils/bin/mkfs.erofs ]; then
          sudo apt-get install -y autoconf automake libtool pkg-config liblz4-dev uuid-dev zlib1g-dev
          git clone --depth 1 -b v1.9.4 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-src
          (cd /tmp/erofs-src && ./autogen.sh && ./configure --prefix="$HOME/erofs-utils" && make -j$(nproc) && make install)
        fi
        echo "$HOME/erofs-utils/bin" >> "$GITHUB_PATH"
    - name: Verify stock vendors
      working-directory: stock
      run: |
        for z in a13_stock_vendor.zip a14_stock_vendor.zip; do cat "$z".[0-9][0-9] > "$z"; done
        unzip -q a14_stock_vendor.zip
        sudo unzip -q a13_stock_vendor.zip -d a13_vendor
        sha256sum -c SHA256SUMS
        md5sum -c MD5SUMS
    - name: Build vendor
      run: |
        DLKM=$(ls kernel/*_vendor_dlkm.tar.gz)
        NAME=$(basename "$DLKM" _vendor_dlkm.tar.gz)_vendor
        mkdir -p dist
        sudo env PATH="$PATH" bash kernel_build/a13/vendor/mkvendor_a13.sh stock/a13_vendor stock/vendor_a14.img "$DLKM" "dist/$NAME.img"
        sudo chown "$(id -u):$(id -g)" "dist/$NAME.img"
        (cd dist && zip -9 -q "$NAME.zip" "$NAME.img" && rm "$NAME.img")
        cp kernel/langsdorff@a13*.zip kernel/langsdorff@a13*.tar dist/
        (cd dist && sha256sum * > SHA256SUMS && md5sum $(ls | grep -v SUMS) > MD5SUMS && cat SHA256SUMS MD5SUMS)
    - name: Upload to gofile
      working-directory: dist
      run: |
        token= folder=
        for f in *; do
          args=(-F "file=@$f")
          [ -n "$folder" ] && args+=(-F "token=$token" -F "folderId=$folder")
          r=$(curl -sS --fail --retry 3 -m 3600 "${args[@]}" https://upload.gofile.io/uploadfile)
          [ "$(jq -r .status <<<"$r")" = ok ] || { echo "$f: $r"; exit 1; }
          [ "$(jq -r .data.md5 <<<"$r")" = "$(md5sum "$f" | cut -d' ' -f1)" ] || { echo "$f: md5 mismatch after upload"; exit 1; }
          if [ -z "$folder" ]; then
            token=$(jq -r .data.guestToken <<<"$r")
            folder=$(jq -r .data.parentFolder <<<"$r")
            link=$(jq -r .data.downloadPage <<<"$r")
          fi
          echo "$f uploaded"
        done
        echo "gofile: $link"
        { echo "### gofile"; echo "$link"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
