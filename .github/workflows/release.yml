name: Release
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  Enforcing:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install tools
      run: |
        sudo apt-get install python2 pahole libelf-dev zstd brotli -y
        DIR="$(readlink -f .)"
        PARENT_DIR="$(readlink -f "${DIR}/..")"
        git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$PARENT_DIR/clang-r450784d" --depth=1
    - uses: rui314/setup-mold@v1
    - name: Build
      env:
        XY_TAG: ${{ github.ref_name }}
      run: |
        VARIANT=e bash kernel_build/builda13.sh "$(pwd)"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Enforcing-Build
        path: kernel_build/langsdorff@a13*
  Permissive:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install tools
      run: |
        sudo apt-get install python2 pahole libelf-dev zstd brotli -y
        DIR="$(readlink -f .)"
        PARENT_DIR="$(readlink -f "${DIR}/..")"
        git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$PARENT_DIR/clang-r450784d" --depth=1
    - uses: rui314/setup-mold@v1
    - name: Build
      env:
        XY_TAG: ${{ github.ref_name }}
      run: |
        VARIANT=p bash kernel_build/builda13.sh "$(pwd)"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Permissive-Build
        path: kernel_build/langsdorff@a13*
  EnforcingNoOC:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: no-oc-root
    - name: Install tools
      run: |
        sudo apt-get install python2 pahole libelf-dev zstd brotli -y
        DIR="$(readlink -f .)"
        PARENT_DIR="$(readlink -f "${DIR}/..")"
        git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$PARENT_DIR/clang-r450784d" --depth=1
    - uses: rui314/setup-mold@v1
    - name: Build
      env:
        XY_TAG: ${{ github.ref_name }}
      run: |
        VARIANT=e bash kernel_build/builda13.sh "$(pwd)"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: EnforcingNoOC-Build
        path: kernel_build/langsdorff@a13*
  PermissiveNoOC:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: no-oc-root
    - name: Install tools
      run: |
        sudo apt-get install python2 pahole libelf-dev zstd brotli -y
        DIR="$(readlink -f .)"
        PARENT_DIR="$(readlink -f "${DIR}/..")"
        git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$PARENT_DIR/clang-r450784d" --depth=1
    - uses: rui314/setup-mold@v1
    - name: Build
      env:
        XY_TAG: ${{ github.ref_name }}
      run: |
        VARIANT=p bash kernel_build/builda13.sh "$(pwd)"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: PermissiveNoOC-Build
        path: kernel_build/langsdorff@a13*
  Vendor:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Checkout stock vendors
      uses: actions/checkout@v6
      with:
        ref: a13-vendor-stock
        path: stock
    - name: Install tools
      run: |
        sudo apt-get install -y attr zip unzip autoconf automake libtool pkg-config liblz4-dev uuid-dev zlib1g-dev
        git clone --depth 1 -b v1.9.4 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-src
        (cd /tmp/erofs-src && ./autogen.sh && ./configure --prefix="$HOME/erofs-utils" && make -j$(nproc) && make install)
        echo "$HOME/erofs-utils/bin" >> "$GITHUB_PATH"
    - name: Verify stock vendors
      working-directory: stock
      run: |
        for z in a13_stock_vendor.zip a14_stock_vendor.zip; do cat "$z".[0-9][0-9] > "$z"; done
        unzip -q a14_stock_vendor.zip
        sudo unzip -q a13_stock_vendor.zip -d a13_vendor
        sha256sum -c SHA256SUMS
        md5sum -c MD5SUMS
    - name: Build vendor
      run: |
        NAME=langsdorff@a13-${{ github.ref_name }}_vendor
        mkdir -p dist
        sudo env PATH="$PATH" bash kernel_build/a13/vendor/mkvendor_a13.sh stock/a13_vendor stock/vendor_a14.img "dist/$NAME.img"
        sudo chown "$(id -u):$(id -g)" "dist/$NAME.img"
        python3 kernel_build/avbtool add_hashtree_footer --image "dist/$NAME.img" --partition_name vendor \
          --hash_algorithm sha256 --algorithm SHA256_RSA4096 \
          --key kernel_build/mkbootimg/gki/testdata/testkey_rsa4096.pem --do_not_generate_fec
        (cd dist && zip -9 -q "$NAME.zip" "$NAME.img" && rm "$NAME.img")
        cp kernel_build/a13/odm_a14.img "dist/langsdorff@a13-${{ github.ref_name }}_odm.img"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Vendor-Build
        path: |
          dist/*_vendor.zip
          dist/*_odm.img
  ReleaseKernel:
    runs-on: ubuntu-22.04
    needs: [Enforcing, Permissive, EnforcingNoOC, PermissiveNoOC, Vendor]
    steps:
      - name: Download Enforcing Build
        uses: actions/download-artifact@v8
        with:
          name: Enforcing-Build
          path: kernel_build/enforcing
      - name: Download Permissive Build
        uses: actions/download-artifact@v8
        with:
          name: Permissive-Build
          path: kernel_build/permissive
      - name: Download EnforcingNoOC Build
        uses: actions/download-artifact@v8
        with:
          name: EnforcingNoOC-Build
          path: kernel_build/enforcing-nooc
      - name: Download PermissiveNoOC Build
        uses: actions/download-artifact@v8
        with:
          name: PermissiveNoOC-Build
          path: kernel_build/permissive-nooc
      - name: Download Vendor Build
        uses: actions/download-artifact@v8
        with:
          name: Vendor-Build
          path: kernel_build/vendor
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: langsdorff@a13-${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            kernel_build/enforcing/langsdorff*
            kernel_build/permissive/langsdorff*
            kernel_build/enforcing-nooc/langsdorff*
            kernel_build/permissive-nooc/langsdorff*
            kernel_build/vendor/langsdorff*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
